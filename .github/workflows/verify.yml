name: Verify Keep Vault MCK
on:
  push:
    branches: [main, 'development/**']
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require complete source and tests
        run: |
          test -f package.json
          test -f index.html
          test -f src/main.tsx
          test -f src/store.ts
          test -f src/promptEngine.ts
          test -f src/style.css
          test -f tests/organization.test.mjs
          test -f tests/promptEngine.test.mjs
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
