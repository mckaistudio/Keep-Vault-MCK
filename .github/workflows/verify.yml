name: Verify Keep Vault MCK
on:
  push:
    branches: [main, 'development/**']
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check source availability
        id: source
        shell: bash
        run: |
          if [ -f package.json ]; then echo 'ready=true' >> "$GITHUB_OUTPUT"; else echo 'ready=false' >> "$GITHUB_OUTPUT"; echo 'BLOCKED: application source not yet committed'; fi
      - name: Install dependencies
        if: steps.source.outputs.ready == 'true'
        run: npm install --no-audit --no-fund
      - name: Unit tests
        if: steps.source.outputs.ready == 'true'
        run: npm test
      - name: Production build
        if: steps.source.outputs.ready == 'true'
        run: npm run build
