<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Keep Vault MCK</title><link rel="stylesheet" href="popup.css"></head>
<body><main><h1>Keep Vault <span>MCK</span></h1><p>Highlight text on a webpage, then click Capture selection.</p><button id="capture">Capture selection</button><label>Title<input id="title" maxlength="160" placeholder="Capture title"></label><label>Selected text<textarea id="content" rows="7" maxlength="20000" placeholder="Your selection appears here"></textarea></label><label>Source URL<input id="source" readonly></label><label>Category<select id="category"><option value="PMC">Coding</option><option value="PMB">Business</option><option value="PMG">Creative</option><option value="WBR">Resources</option><option value="PRH">Personal</option></select></label><label>Tags<input id="tags" maxlength="300" placeholder="research, useful"></label><div class="actions"><button id="copy">Copy</button><button id="download">Save file</button><button id="cancel">Cancel</button><button id="keepCopy">Copy for Keep</button><button id="keep">Open Google Keep</button></div><p id="status" role="status" aria-live="polite"></p><small>Only manual capture. No automatic upload or background monitoring.</small></main><script src="popup.js"></script></body></html>
